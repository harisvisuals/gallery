<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visuals by Haris</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      font-family:Arial,sans-serif;
      background:#0b0b0b;
      color:white;
      overflow-x:hidden;
    }

    header{
      min-height:80vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:30px;
      background:
      linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.82)),
      url("photos/uphillviewkumrat.jpg");
      background-size:cover;
      background-position:center;
    }

    .hero{max-width:850px}

    .hero h1{
      font-size:72px;
      font-weight:700;
      letter-spacing:2px;
      margin-bottom:18px;
      background:linear-gradient(to right,#ffffff,#b8c7ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      color:#d6d6d6;
      font-size:18px;
      line-height:1.8;
      max-width:700px;
      margin:auto;
    }

    .insta-btn{
      display:inline-flex;
      align-items:center;
      gap:12px;
      margin-top:35px;
      padding:14px 28px;
      border-radius:60px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      font-size:15px;
      background:linear-gradient(135deg,#833AB4,#C13584,#E1306C,#FD1D1D,#F77737);
      box-shadow:0 10px 35px rgba(225,48,108,0.35);
      transition:0.35s;
    }

    .insta-btn:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 15px 40px rgba(225,48,108,0.5);
    }

    .section-title{
      text-align:center;
      padding:65px 20px 30px;
      font-size:34px;
      letter-spacing:2px;
      color:white;
    }

    .gallery{
      max-width:1450px;
      margin:auto;
      padding:20px;
      columns:3 300px;
      column-gap:16px;
    }

    .photo{
      margin-bottom:16px;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      background:#161616;
      break-inside:avoid;
      position:relative;
      min-height:220px;
    }

    .photo img{
      width:100%;
      display:block;
      opacity:0;
      transition:opacity 0.5s ease, transform 0.45s ease, filter 0.45s ease;
    }

    .photo img.loaded{
      opacity:1;
    }

    .photo:hover img.loaded{
      transform:scale(1.05);
      filter:brightness(78%);
    }

    .loader{
      position:absolute;
      top:50%;
      left:50%;
      width:34px;
      height:34px;
      margin-top:-17px;
      margin-left:-17px;
      border:3px solid rgba(255,255,255,0.25);
      border-top:3px solid white;
      border-radius:50%;
      animation:spin 0.9s linear infinite;
      z-index:2;
    }

    .photo.loaded .loader{
      display:none;
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.88);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:25px;
    }

    .lightbox.active{display:flex}

    .lightbox-content{
      max-width:95vw;
      max-height:90vh;
      text-align:center;
    }

    .lightbox img{
      max-width:100%;
      max-height:78vh;
      border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
    }

    .lightbox-actions{margin-top:18px}

    .download-btn,.close-btn{
      display:inline-block;
      margin:5px;
      padding:12px 22px;
      border-radius:40px;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .download-btn{
      background:white;
      color:black;
    }

    .download-btn:hover{transform:translateY(-2px)}

    .close-btn{
      background:#1f1f1f;
      color:white;
      border:1px solid #444;
      cursor:pointer;
    }

    footer{
      margin-top:70px;
      padding:45px 20px;
      border-top:1px solid #1f1f1f;
      text-align:center;
      color:#8d8d8d;
    }

    footer a{
      color:white;
      text-decoration:none;
    }

    @media(max-width:900px){
      .hero h1{font-size:46px}
      .hero p{font-size:15px}
      .gallery{columns:1}
    }
  </style>
</head>

<body>

<header>
  <div class="hero">
    <h1>Visuals by Haris</h1>

    <p>
      A collection of phone photography —
      landscapes, roads, rivers, valleys, evening skies,
      textures, shadows, rain, and quiet moments captured along the way.
    </p>

    <a class="insta-btn" href="https://instagram.com/harisvisuals" target="_blank">
      <span>📸</span>
      <span>@harisvisuals</span>
    </a>
  </div>
</header>

<h2 class="section-title">Gallery</h2>

<section class="gallery">

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratnaturalcoolingpotraitview.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/nightkumratvalley.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/uphillviewkumrat.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratviewfromlcwindow.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumrathillsvalleycow.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/greenhillskumrat2.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/greenhillskumrat.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumrathillsviewwithcarsplashoutside.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/greenerykumrat.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalleystonescottagejungle.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalleystones.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratjunglewideview.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratjunglewhitestonespotraitview2.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratjunglewhitestonespotraitview.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/junglekumratwhitestones.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratthalriver.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalleyevening2.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratrivereveing.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratriver2.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/junglecottage.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/eveninginkumrat.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalleyevening3.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalley.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/sunsetkumratvalley.jpg" alt="Photo"></div>

  <div class="photo"><div class="loader"></div><img data-src="photos/kumratvalleyevening.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/kumratjungle.jpg" alt="Photo"></div>
  <div class="photo"><div class="loader"></div><img data-src="photos/cardrivenightshot.jpg" alt="Photo"></div>

</section>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <img id="lightbox-img" src="">
    <div class="lightbox-actions">
      <a id="download-link" class="download-btn" href="" download>Download Photo</a>
      <button class="close-btn" onclick="closeLightbox()">Close</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Visuals by Haris</p>
  <br>
  <p>
    Instagram:
    <a href="https://instagram.com/harisvisuals" target="_blank">@harisvisuals</a>
  </p>
</footer>

<script>
  const images = document.querySelectorAll(".photo img");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const img = entry.target;

        if(!img.src){
          img.src = img.dataset.src;
        }

        img.onload = () => {
          img.classList.add("loaded");
          img.parentElement.classList.add("loaded");
        };

        img.onclick = () => {
          openLightbox(img.src);
        };

        observer.unobserve(img);
      }
    });
  }, {
    rootMargin: "300px"
  });

  images.forEach(img => {
    observer.observe(img);
  });

  function openLightbox(src){
    document.getElementById("lightbox-img").src = src;
    document.getElementById("download-link").href = src;
    document.getElementById("lightbox").classList.add("active");
  }

  function closeLightbox(){
    document.getElementById("lightbox").classList.remove("active");
    document.getElementById("lightbox-img").src = "";
  }
</script>

</body>
</html>
